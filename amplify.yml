# Amplify Hosting のビルド定義(docs/architecture.md §1.3)。
#
# - モノレポなので applications の一覧に web/ だけを載せる。appRoot は Amplify 側の
#   環境変数 AMPLIFY_MONOREPO_APP_ROOT(CDK の WebHosting で設定)と一致させること。
# - Next.js は静的エクスポート(output: 'export')なので、配信するのは web/out/ の中身。
# - このファイルは Amplify コンソール / CDK 側のビルド設定より優先される。
#   ビルド手順はここだけで管理し、CDK には書かない(二重管理を避ける)。
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            # CI(.github/workflows/ci.yml)と同じ Node 22 に揃える。ビルドイメージ既定の
            # Node に任せると、Next.js が要求するバージョンを満たさない可能性がある。
            - nvm install 22
            - node --version
            # NEXT_PUBLIC_* はビルド時に JS へ埋め込まれる。web/src/lib/api.ts・auth.ts には
            # dev の値がフォールバックとして書かれているため、注入に失敗しても dev 向けに
            # ビルドが成功してしまう。気づけるよう、未設定ならここで止める。
            - 'test -n "$NEXT_PUBLIC_API_BASE_URL" || (echo "ERROR: NEXT_PUBLIC_API_BASE_URL is not set" && exit 1)'
            - 'test -n "$NEXT_PUBLIC_STAFF_CLIENT_ID" || (echo "ERROR: NEXT_PUBLIC_STAFF_CLIENT_ID is not set" && exit 1)'
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
